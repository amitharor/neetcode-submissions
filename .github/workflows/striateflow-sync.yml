# Sends this repository's new submissions to StriateFlow on every push, and once a night to catch anything
# missed. The key it sends is the one GitHub makes for this run alone: read only, this repository only, and
# gone when the run ends, so no token is stored anywhere. Copy to .github/workflows/ in a solutions repository.
name: StriateFlow sync
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * *'
permissions:
  contents: read
concurrency:
  group: striateflow-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send new submissions to StriateFlow
        env:
          REPO: ${{ github.repository }}
          RUN_KEY: ${{ github.token }}
        run: |
          jq -n --arg repo "$REPO" --arg token "$RUN_KEY" '{repo: $repo, token: $token}' |
            curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors --max-time 120 \
              -H 'content-type: application/json' --data @- https://www.striateflow.com/api/repo-sync
